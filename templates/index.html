<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Recorder</title>
    <link rel='stylesheet' href='static/styles.css'>
</head>
<body>
    <header>
        <img src='https://upload.wikimedia.org/wikipedia/commons/3/3e/Ford_logo_flat.svg' alt='ford_logo'>
        <img src='https://upload.wikimedia.org/wikipedia/commons/4/49/KU_Leuven_logo.svg' alt='kul_logo'>
    </header>
    <nav>
        <a id='device_tab_button' href='#tabDevice' class='active' onclick='device_tab_click(event, "tabDevice")'>Device</a>
        <a id='scan_tab_button' href='#tabScan' onclick='openTab(event, "tabScan")'>Scan</a>
        <a id='record_tab_button' href='#tabRecord' onclick='openTab(event, "tabRecord")'>Record</a>
        <a id='label_tab_button' href='#tabLabel' onclick='openTab(event, "tabLabel")'>Label</a>
        <a id='audio_tab_button' href='#tabAudio' onclick='openTab(event, "tabAudio")'>Audio</a>
        <a id='setting_tab_button' href='#tabSettings' onclick='openTab(event, "tabSettings")'>Settings</a>
    </nav>
    <div id='message' class='message'>no message</div>
    <div class='container'>
        <div id='tabDevice' class='tab-content active'>
            <table id='device-table'>
                <thead>
                    <tr>
                        <th>Device Status</th>
                        <th>Network Mode</th>
                    </tr>
                </thead>
                <tbody id='device-table-body'>
                </tbody>
            </table>
            <div id='mode_message' class='message'></div>
        </div>
        <div id='tabScan' class='tab-content'>
            <div id='qr-reader' style="width: 100%"></div>
            <button class='blue' onclick='scan_vin()'>Scan</button>
        </div>
        <div id='tabRecord' class='tab-content'>
            <button class='green' onclick='startRecording()'>Start</button>
            <button class='red' onclick='stopRecording()'>Stop</button>
        </div>
        <div id='tabLabel' class='tab-content'>
            <button class='green' onclick='label(0)'>Normall</button>
            <button class='yellow' onclick='label(1)'>Squek</button>
            <button class='orange' onclick='label(2)'>Rattley</button>
            <button class='red' onclick='label(3)'>S & R</button>
        </div>
        <div id='tabAudio' class='tab-content'>
            <audio id='audio_box' controls controlsList="nodownload noplaybackrate" autoplay>
                <source id='audio_source' src=''>
            </audio>
            <hr>
            <button class='blue' onclick='fetch_audio()'>Check Audio</button>
            <button class='green' onclick='play()'>Play</button>
            <button class='orange' onclick='download()'>Download</button>
            <button class='red' onclick='delete_audio()'>Delete</button>

        </div>
        <div id='tabSettings' class='tab-content'>
            <button class='blue' onclick='select_protocol(0)'>rtp</button>
            <button class='blue' onclick='select_protocol(1)'>tcp</button>
            <form action="/logout" method="get">
                <button type="submit" class='red'>Log Out</button>
            </form>            
        </div>
    </div>

    <script type="text/javascript">
        const selected_device = '{{ device }}';
     </script>
    <script src='https://unpkg.com/html5-qrcode' type='text/javascript'></script>
    <script src='static/scripts.js'></script>
</body>
</html>
