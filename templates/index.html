<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Recorder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        .container {
            padding: 20px;
        }
        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
        }
        nav {
            display: flex;
            justify-content: space-around;
            background-color: #333;
            padding: 10px 0;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px;
            font-size: 1.2em;
        }
        nav a.active {
            background-color: #555;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .tab-content button {
            display: block;
            margin: 10px 0;
            padding: 15px;
            font-size: 1.2em;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .tab-content button.start {
            background-color: #28a745;
            color: white;
        }
        .tab-content button.stop {
            background-color: #dc3545;
            color: white;
        }
        .tab-content button.blue {
            background-color: #007BFF;
            color: white;
        }
        .tab-content button:hover.start {
            background-color: #218838;
        }
        .tab-content button:hover.stop {
            background-color: #c82333;
        }
        .tab-content button:hover.blue {
            background-color: #0056b3;
        }
        .message {
            margin: 20px 0;
            padding: 20px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Recorder</h1>
    </header>
    <nav>
        <a href='#tabDevice' class='active' onclick='openTab(event, "tabDevice")'>Device</a>
        <a href='#tabScan' onclick='openTab(event, "tabScan")'>Scan</a>
        <a href='#tabRecord' onclick='openTab(event, "tabRecord")'>Record</a>
        <a href='#tabLabel' onclick='openTab(event, "tabLabel")'>Label</a>
        <a href='#tabSettings' onclick='openTab(event, "tabSettings")'>Settings</a>
    </nav>
    <div class='container'>
        <div id='tabDevice' class='tab-content active'>
            <div class='message'>Message for Device</div>
            <button class='blue'>Device-1</button>
            <button class='blue'>Device-2</button>
        </div>
        <div id='tabScan' class='tab-content'>
            <div id='scan_message' class='message'>Message for Scan</div>
            <div id='qr-reader' style="width: 100%"></div>
            <button class='blue' onclick='scan_vin()'>Scan</button>
        </div>
        <div id='tabRecord' class='tab-content'>
            <div class='message'>Message for Record</div>
            <button class='start'>Start</button>
            <button class='stop'>Stop</button>
        </div>
        <div id='tabLabel' class='tab-content'>
            <div class='message'>Message for Label</div>
            <button class='blue'>Button Label-1</button>
            <button class='blue'>Button Label-2</button>
        </div>
        <div id='tabSettings' class='tab-content'>
            <div class='message'>Message for Settings</div>
            <button class='blue'>Button Settings-1</button>
            <button class='blue'>Button Settings-2</button>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript">
    </script>

    <script>
        function openTab(event, tabId) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName('tab-content');
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = 'none';
                tabcontent[i].classList.remove('active');
            }
            tablinks = document.querySelectorAll('nav a');
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove('active');
            }
            document.getElementById(tabId).style.display = 'block';
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function scan_vin() {
            console.log('scan vin')
            html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback);
        }
        let qrboxFunction = function (viewfinderWidth, viewfinderHeight) {
            let minEdgePercentage = 0.7;
            let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
            let qrboxSize = Math.floor(minEdgeSize * minEdgePercentage);
            return {
                width: qrboxSize,
                height: qrboxSize
            };
        };
        const html5QrCode = new Html5Qrcode("qr-reader", { formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE] });
        const qrCodeSuccessCallback = (decodedText, decodedResult) => {
            console.log(`Code scanned = ${decodedText}`, decodedResult);
            if (decodedText.startsWith("WF") && decodedText.length == 17) {
                document.getElementById("message_scan").innerHTML = "scanned VIN: " + decodedText;
            }
        }
        const config = { fps: 20, qrbox: qrboxFunction };

        // Default to tab Device on page load
        document.getElementById('tabDevice').style.display = 'block';
        

    </script>
</body>
</html>
